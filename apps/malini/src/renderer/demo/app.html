<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Malini</title>
		<script src="./theme-boot.js"></script>
		<style>
			.traffic-lights {
				position: fixed;
				z-index: 2147483647;
				top: 13px;
				left: 12px;
				display: flex;
				gap: 8px;
				pointer-events: none;
			}

			.demo-cursor {
				position: fixed;
				z-index: 2147483647;
				top: 0;
				left: 0;
				pointer-events: none;
				filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.35));
				transition:
					translate 700ms cubic-bezier(0.65, 0, 0.35, 1),
					scale 120ms ease,
					opacity 400ms ease;
			}

			.demo-cursor svg {
				display: block;
				translate: -4px -2.5px;
			}

			.demo-cursor[data-pressed] {
				scale: 0.86;
			}

			.demo-cursor[hidden] {
				display: none;
			}

			.demo-cursor[data-gone] {
				opacity: 0;
			}

			.traffic-lights i {
				width: 12px;
				height: 12px;
				border-radius: 50%;
				box-shadow: inset 0 0 0 0.5px rgb(0 0 0 / 0.2);
			}
		</style>
	</head>
	<body>
		<div class="traffic-lights" aria-hidden="true">
			<i style="background: #ff5f57"></i>
			<i style="background: #febc2e"></i>
			<i style="background: #28c840"></i>
		</div>
		<div class="demo-cursor" aria-hidden="true" hidden>
			<svg width="22" height="22" viewBox="0 0 22 22">
				<path
					d="M4 2.5v15.2l4.1-3.9 2.6 6 2.6-1.1-2.6-5.9h5.7z"
					fill="#000"
					stroke="#fff"
					stroke-width="1.4"
					stroke-linejoin="round"
				/>
			</svg>
		</div>
		<div id="app" class="app-scroll-root"></div>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
