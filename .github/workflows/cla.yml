name: CLA

# pull_request_target runs in the base repository with a write token, so no step may check out or run pull request code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, reopened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: contributor license agreement
    if: >-
      (github.event.pull_request.user.login || github.event.issue.user.login) != 'szymeo' &&
      (github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
      (github.event.comment.body == 'recheck' ||
      contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))))
    runs-on: ubuntu-latest
    steps:
      - name: Create the signatures branch on the first run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/branches/cla-signatures" --silent 2> /dev/null ||
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/cla-signatures -f sha="$GITHUB_SHA" --silent
      - uses: iainmcgin/cla-github-action@0d27e5a16278d4adb6b0c4b92f08ad27b0a21dc8 # v3.2.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path-to-document: https://github.com/bestboyhq/malini/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: szymeo,*[bot],Copilot,noreply@anthropic.com,cursoragent@cursor.com,noreply@cursor.com
