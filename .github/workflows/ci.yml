name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: check and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm -r --filter '!malini' --reporter-hide-prefix --if-present test

  unit:
    name: unit tests ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter "malini^..." build
      - run: pnpm --filter malini exec vitest run --shard=${{ matrix.shard }}

  reuse:
    name: what the pull request already proved
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      e2e: ${{ steps.e2e.outputs.needed }}
      update: ${{ steps.update.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip e2e when a pull request of this repository passed it on this exact tree
        id: e2e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=e2e-passed-$(git rev-parse 'HEAD^{tree}')" --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == .workflow_run.repository_id)] | length') || passed=0
          echo "needed=$([ "$passed" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Skip the update test when nothing it covers changed since the last release
        id: update
        run: |
          since=$(git describe --tags --match 'v*' --abbrev=0) || since=$(git rev-list --max-parents=0 HEAD)
          needed=false
          git diff --name-only "$since" HEAD | grep -qiE '^apps/malini/(src/main/(index|window|storage-name)\.ts|src/lib/app/platform/(register|shell-host|window)\.ts|src/lib/app/.*update|src/preload/|electron-builder\.yml|build/|package\.json|scripts/update-e2e\.mjs)|^(pnpm-lock|pnpm-workspace)\.yaml|^\.github/(workflows/ci\.yml|actions/)' && needed=true
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  app:
    name: e2e on macOS ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.e2e != 'false' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'push' && '[1, 2, 3]' || '[1, 2, 3, 4, 5]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter "malini..." build
      - name: Download Electron
        run: for _ in 1 2 3; do pnpm --filter malini exec install-electron && exit 0; sleep 10; done; exit 1
      - name: Deal the tests round robin, so slow specs spread over every shard
        working-directory: apps/malini
        shell: bash
        run: |
          pnpm exec playwright test --list | grep ' › ' | awk -v n=${{ strategy.job-total }} -v i=${{ matrix.shard }} 'NR % n == i % n' > "$RUNNER_TEMP/tests.txt"
          test -s "$RUNNER_TEMP/tests.txt"
          test "$(pnpm exec playwright test --list --test-list "$RUNNER_TEMP/tests.txt" | grep -c ' › ')" -eq "$(wc -l < "$RUNNER_TEMP/tests.txt")" || {
            echo "::error::Playwright finds fewer tests than this shard dealt; a test title holding › splits in --test-list and would run nowhere."
            exit 1
          }
      - run: pnpm --filter malini exec playwright test --test-list "$RUNNER_TEMP/tests.txt"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: apps/malini/test-results

  proof:
    name: remember the tree e2e passed on
    needs: app
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/commit"
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-passed-${{ env.TREE }}
          path: ${{ runner.temp }}/commit
          retention-days: 14

  version:
    name: next version from the merged commits
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: next
        run: echo "version=$(node apps/malini/scripts/version.mjs)" >> "$GITHUB_OUTPUT"

  release:
    name: build, sign and notarize
    needs: version
    if: needs.version.outputs.next != ''
    runs-on: macos-latest
    env:
      V: ${{ needs.version.outputs.next }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - &import-certificate
        name: Import the Developer ID certificate
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db" pw=$(openssl rand -base64 24)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$CSC_LINK" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc" > /dev/null
          security list-keychains -d user | tr -d '"' | xargs security list-keychains -d user -s "$kc"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - run: npm pkg set version="$V"
        working-directory: apps/malini
      - run: xcrun notarytool store-credentials malini --apple-id "$APPLE_ID" --team-id 59F3NS99CS --password "$APPLE_APP_SPECIFIC_PASSWORD"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      - run: pnpm --filter malini release
        env:
          APPLE_KEYCHAIN_PROFILE: malini
          MAIN_VITE_LOGDASH_SITE: ${{ secrets.MALINI_LOGDASH_SITE }}
          MAIN_VITE_LOGDASH_API_KEY: ${{ secrets.MALINI_LOGDASH_API_KEY }}
      - name: Open the signed build once
        working-directory: apps/malini
        run: node scripts/packaged-smoke.mjs
      - run: dmg="apps/malini/release/malini-arm64.dmg" && xcrun notarytool submit "$dmg" --keychain-profile malini --wait && xcrun stapler staple "$dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          if-no-files-found: error
          path: |
            apps/malini/release/malini-${{ env.V }}-arm64*
            apps/malini/release/malini-arm64.dmg*
            apps/malini/release/latest-mac.yml

  update:
    name: signed builds update themselves
    needs: [version, reuse]
    if: ${{ !cancelled() && needs.version.outputs.next != '' && needs.reuse.outputs.update != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - *import-certificate
      - run: pnpm --filter malini test:update

  publish:
    name: publish the release
    needs: [checks, unit, app, version, release, update]
    if: ${{ !cancelled() && needs.release.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - run: gh release create "v$V" --generate-notes --target "$GITHUB_SHA" malini-"$V"-arm64* malini-arm64.dmg* latest-mac.yml
        env:
          V: ${{ needs.version.outputs.next }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
