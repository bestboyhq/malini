name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: check and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm --filter @malini/site test

  unit:
    name: unit tests on ${{ matrix.os }} ${{ matrix.part }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [Linux, Linux arm64, macOS, Windows, Windows arm64]
        part: [1/3, 2/3, 3/3, packages]
        include:
          - os: Linux
            runner: ubuntu-24.04
          - os: Linux arm64
            runner: ubuntu-24.04-arm
          - os: macOS
            runner: macos-latest
          - os: Windows
            runner: windows-latest
          - os: Windows arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - &windows-long-paths
        if: runner.os == 'Windows'
        name: Let git check out paths longer than 260 characters
        run: git config --system core.longpaths true
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - if: runner.os == 'Linux'
        name: Install bubblewrap and let it use user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm --filter "malini^..." build
      - if: matrix.part != 'packages'
        run: pnpm --filter malini exec vitest run --shard=${{ matrix.part }}
      - if: matrix.part == 'packages'
        run: pnpm -r --filter '!malini' --filter '!@malini/site' --reporter-hide-prefix --if-present test

  reuse:
    name: what the pull request already proved
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      e2e: ${{ steps.e2e.outputs.needed }}
      update: ${{ steps.update.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip e2e when a pull request of this repository passed it on this exact tree
        id: e2e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=e2e-passed-$(git rev-parse 'HEAD^{tree}')" --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == .workflow_run.repository_id)] | length') || passed=0
          echo "needed=$([ "$passed" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Skip the update test when nothing it covers changed since the last release
        id: update
        run: |
          since=$(git describe --tags --match 'v*' --abbrev=0) || since=$(git rev-list --max-parents=0 HEAD)
          needed=false
          git diff --name-only "$since" HEAD | grep -qiE '^apps/malini/(src/main/(index|window|storage-name)\.ts|src/lib/app/platform/(register|shell-host|window)\.ts|src/lib/app/.*update|src/preload/|electron-builder\.yml|build/|package\.json|scripts/update-e2e\.mjs)|^(pnpm-lock|pnpm-workspace)\.yaml|^\.github/(workflows/ci\.yml|actions/)' && needed=true
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  app:
    name: e2e on ${{ matrix.os }} ${{ matrix.shard }}/${{ github.event_name == 'push' && 3 || 5 }}
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.e2e != 'false' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [macOS, Linux, Windows]
        shard: ${{ fromJSON(github.event_name == 'push' && '[1, 2, 3]' || '[1, 2, 3, 4, 5]') }}
        include:
          - os: macOS
            runner: macos-latest
          - os: Linux
            runner: ubuntu-24.04
          - os: Windows
            runner: windows-latest
    env:
      SHARDS: ${{ github.event_name == 'push' && 3 || 5 }}
    defaults:
      run:
        shell: bash
    steps:
      - *windows-long-paths
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - if: runner.os == 'Linux'
        name: Start a virtual display, and let Electron's sandbox and bubblewrap use user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap dbus-daemon dbus-x11 gnome-keyring libasound2t64 libgbm1 libgtk-3-0t64 libnotify4 libnss3 libsecret-1-0 libxss1 libxtst6 xdg-utils xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          Xvfb :99 -screen 0 1920x1080x24 &
          echo DISPLAY=:99 >> "$GITHUB_ENV"
      - run: pnpm --filter "malini..." build
      - name: Download Electron
        run: for _ in 1 2 3; do pnpm --filter malini exec install-electron && exit 0; sleep 10; done; exit 1
      - name: Deal the tests round robin, so slow specs spread over every shard
        working-directory: apps/malini
        run: |
          pnpm exec playwright test --list | grep ' › ' | awk -v n="$SHARDS" -v i=${{ matrix.shard }} 'NR % n == i % n' > "$RUNNER_TEMP/tests.txt"
          test -s "$RUNNER_TEMP/tests.txt"
          test "$(pnpm exec playwright test --list --test-list "$RUNNER_TEMP/tests.txt" | grep -c ' › ')" -eq "$(wc -l < "$RUNNER_TEMP/tests.txt")" || {
            echo "::error::Playwright finds fewer tests than this shard dealt; a test title holding › splits in --test-list and would run nowhere."
            exit 1
          }
      - run: pnpm --filter malini exec playwright test --test-list "$RUNNER_TEMP/tests.txt"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.shard }}
          path: apps/malini/test-results

  proof:
    name: remember the tree e2e passed on
    needs: app
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Refuse to remember a tree whose e2e did not all pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          counts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name | startswith("e2e on "))] | [(map(select(.conclusion != "success")) | length), length] | @tsv')
          read -r failed total <<< "$counts"
          if [ "$total" -eq 0 ]; then
            echo "::error::this run has no e2e job to remember"
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed of $total e2e job(s) of this run did not succeed"
            exit 1
          fi
      - run: |
          echo "TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/commit"
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-passed-${{ env.TREE }}
          path: ${{ runner.temp }}/commit
          retention-days: 14

  version:
    name: next version from the merged commits
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: next
        run: echo "version=$(node apps/malini/scripts/version.mjs)" >> "$GITHUB_OUTPUT"

  release:
    name: build, sign and notarize
    needs: version
    if: needs.version.outputs.next != ''
    runs-on: macos-latest
    env:
      V: ${{ needs.version.outputs.next }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - &import-certificate
        name: Import the Developer ID certificate
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db" pw=$(openssl rand -base64 24)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$CSC_LINK" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc" > /dev/null
          security list-keychains -d user | tr -d '"' | xargs security list-keychains -d user -s "$kc"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - run: npm pkg set version="$V"
        working-directory: apps/malini
      - run: xcrun notarytool store-credentials malini --apple-id "$APPLE_ID" --team-id 59F3NS99CS --password "$APPLE_APP_SPECIFIC_PASSWORD"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      - run: pnpm --filter malini release
        env:
          APPLE_KEYCHAIN_PROFILE: malini
          MAIN_VITE_LOGDASH_SITE: ${{ secrets.MALINI_LOGDASH_SITE }}
          MAIN_VITE_LOGDASH_API_KEY: ${{ secrets.MALINI_LOGDASH_API_KEY }}
      - name: Open the signed build once
        working-directory: apps/malini
        run: node scripts/packaged-smoke.mjs
      - run: dmg="apps/malini/release/malini-arm64.dmg" && xcrun notarytool submit "$dmg" --keychain-profile malini --wait && xcrun stapler staple "$dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          if-no-files-found: error
          path: |
            apps/malini/release/malini-${{ env.V }}-arm64*
            apps/malini/release/malini-arm64.dmg*
            apps/malini/release/latest-mac.yml

  update:
    name: signed builds update themselves
    needs: [version, reuse]
    if: ${{ !cancelled() && needs.version.outputs.next != '' && needs.reuse.outputs.update != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - *import-certificate
      - run: pnpm --filter malini test:update

  publish:
    name: publish the release
    needs: [checks, unit, app, version, release, update]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Refuse to publish while any job of this run did not succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name != "publish the release") | select(.conclusion != "success" and .conclusion != "skipped")] | length')
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed job(s) of this run did not succeed"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: release
      - run: gh release create "v$V" --generate-notes --target "$GITHUB_SHA" malini-"$V"-arm64* malini-arm64.dmg* latest-mac.yml
        env:
          V: ${{ needs.version.outputs.next }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
