name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: check, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # package.json pins pnpm 12; corepack reads it, so the version lives in one place.
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm -r --reporter-hide-prefix --if-present test

  app:
    # malini ships on macOS only, so the built app is exercised where it runs.
    name: app launches on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # package.json pins pnpm 12; corepack reads it, so the version lives in one place.
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter malini exec playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/malini/test-results
