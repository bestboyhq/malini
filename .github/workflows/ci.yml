name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release in progress must finish; a newer merge waits and releases after it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: check, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # package.json pins pnpm 12; corepack reads it, so the version lives in one place.
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm -r --reporter-hide-prefix --if-present test

  app:
    # malini ships on macOS only, so the built app is exercised where it runs.
    name: app launches on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # package.json pins pnpm 12; corepack reads it, so the version lives in one place.
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter malini exec playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/malini/test-results

  # The version the merged commits call for; empty when none of them is a feat, fix, perf, or breaking change.
  version:
    needs: [checks, app]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags and commits since the last release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: next
        run: echo "version=$(node apps/malini/scripts/version.mjs)" >> "$GITHUB_OUTPUT"

  # Ships the merge as an in-app update: users get it on their next update check.
  release:
    needs: version
    if: needs.version.outputs.next != ''
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      V: ${{ needs.version.outputs.next }}
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import the Developer ID certificate
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db" pw=$(openssl rand -base64 24)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$CSC_LINK" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc" > /dev/null
          security list-keychains -d user | tr -d '"' | xargs security list-keychains -d user -s "$kc"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - run: npm pkg set version="$V"
        working-directory: apps/malini
      - run: xcrun notarytool store-credentials malini --apple-id "$APPLE_ID" --team-id 59F3NS99CS --password "$APPLE_APP_SPECIFIC_PASSWORD"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      - run: pnpm --filter malini release
        env:
          APPLE_KEYCHAIN_PROFILE: malini
      - run: dmg="apps/malini/release/malini-$V-arm64.dmg" && xcrun notarytool submit "$dmg" --keychain-profile malini --wait && xcrun stapler staple "$dmg"
      - run: pnpm --filter malini test:update
      - run: gh release create "v$V" --generate-notes --target "$GITHUB_SHA" "apps/malini/release/malini-$V-arm64"* apps/malini/release/latest-mac.yml
        env:
          GH_TOKEN: ${{ github.token }}
