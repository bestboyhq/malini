name: Set up pnpm and install
description: Enables the pnpm that package.json pins, sets up Node 24 with the pnpm store cached, and installs the workspace.
runs:
  using: composite
  steps:
    - run: corepack enable pnpm
      shell: bash
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
